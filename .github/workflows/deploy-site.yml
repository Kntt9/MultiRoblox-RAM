# Publica o site de divulgação (site/ + dist/MultiRoblox.exe) no GitHub Pages.
# Ativa em: push para main/master tocando o site, o executável ou este workflow,
# ou manualmente (aba Actions → "Deploy site" → Run workflow).
#
# Pré-requisito no repositório: Settings → Pages → Source: "GitHub Actions".
name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'dist/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build deploy folder (site + MultiRoblox.exe)
        run: node site/build-deploy.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
