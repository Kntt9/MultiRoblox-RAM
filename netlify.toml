# Netlify — deploy do site de divulgação do KNT Manager.
# Conecte o repositório no Netlify; o build roda node site/build-deploy.mjs
# e publica a pasta deploy/ (site + MultiRoblox.exe + instalador NSIS).
[build]
  command = "node site/build-deploy.mjs"
  publish = "deploy"

# Garante que os executáveis sejam baixados como arquivo (e não abertos/inspecionados).
[[headers]]
  for = "/MultiRoblox.exe"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment; filename=MultiRoblox.exe"

[[headers]]
  for = "/*-setup.exe"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment; filename=MultiRoblox_0.5.0_x64-setup.exe"
